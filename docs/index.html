<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ちんちらクエスト</title>
<meta name="theme-color" content="#f6e9dd">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== タイトル画面 ===== -->
  <div id="title-screen" class="screen">
    <h1 class="title-logo">ちんちら<br>クエスト</h1>
    <p class="title-sub">グレーちんちらと ぼうけんに でよう</p>
    <button id="title-continue-btn" class="btn btn-primary">つづきから</button>
    <button id="title-newgame-btn" class="btn btn-secondary">さいしょから</button>
  </div>

  <!-- ===== セーブスロット選択画面 ===== -->
  <div id="slot-select-screen" class="screen hidden">
    <h2 id="slot-select-heading" class="screen-heading">スロットを えらんでね</h2>
    <div id="slot-list" class="slot-list"></div>
    <button id="slot-back-btn" class="btn btn-secondary btn-small">タイトルへもどる</button>
  </div>

  <!-- ===== スターター選択画面 ===== -->
  <div id="starter-screen" class="screen hidden">
    <h2 class="screen-heading">どのコと ぼうけんする?</h2>
    <div class="starter-cards">
      <div id="starter-gray" class="starter-card selectable">
        <div class="starter-avatar"></div>
        <div class="starter-name">グレーちんちら</div>
      </div>
      <div class="starter-card locked">
        <div class="starter-avatar starter-avatar-locked">🔒</div>
        <div class="starter-name">しろちんちら</div>
        <div class="starter-soon">近日公開</div>
      </div>
    </div>
    <input id="starter-name-input" class="name-input" type="text" maxlength="6" placeholder="なまえ(6文字まで)">
    <button id="starter-start-btn" class="btn btn-primary" disabled>ぼうけんに でる</button>
  </div>

  <!-- ===== フィールド画面 ===== -->
  <div id="field-screen" class="screen hidden">
    <header class="field-hud">
      <div class="hud-left">
        <span id="hud-name">-</span>
        <span id="hud-level" class="hud-badge">Lv1</span>
      </div>
      <div class="hud-bar-wrap">
        <div class="hud-bar-track"><div id="hud-hp-bar" class="hud-bar-fill"></div></div>
      </div>
      <div class="hud-money"><img class="item-icon" src="assets/items/icon_coin.webp" alt=""> <span id="hud-money">0</span></div>
    </header>

    <div id="map-viewport" class="map-viewport"></div>

    <!-- ===== ゲームボーイ風コントローラー(常に画面下部に固定) ===== -->
    <div class="gb-controls">
      <div class="dpad">
        <button class="dpad-btn dpad-up" data-dir="up">▲</button>
        <button class="dpad-btn dpad-left" data-dir="left">◀</button>
        <div class="dpad-center-spacer"></div>
        <button class="dpad-btn dpad-right" data-dir="right">▶</button>
        <button class="dpad-btn dpad-down" data-dir="down">▼</button>
      </div>
      <button id="select-btn" class="gb-select-btn">SELECT</button>
      <div class="gb-ab">
        <button id="b-btn" class="gb-btn gb-btn-b">B</button>
        <button id="a-btn" class="gb-btn gb-btn-a">A</button>
      </div>
    </div>
  </div>

  <!-- ===== 会話ウィンドウ ===== -->
  <div id="dialogue-overlay" class="dialogue-overlay hidden">
    <div class="dialogue-box">
      <div id="dialogue-name" class="dialogue-name"></div>
      <div id="dialogue-text" class="dialogue-text"></div>
      <div class="dialogue-next">▼ タップで つづける</div>
    </div>
  </div>

  <!-- ===== バトル画面 ===== -->
  <div id="battle-screen" class="screen hidden">
    <div class="battle-field">
      <div class="battle-enemy-area">
        <div class="battle-name-tag"><img id="battle-enemy-elem-icon" class="elem-icon hidden" alt=""><span id="battle-enemy-name">-</span> <span id="battle-enemy-lv" class="hud-badge">Lv1</span></div>
        <div class="hud-bar-track battle-hpbar"><div id="battle-enemy-hp-bar" class="hud-bar-fill"></div><span id="battle-enemy-hp-text" class="hud-bar-label"></span></div>
        <div id="battle-enemy-sprite" class="battle-sprite enemy-sprite"></div>
      </div>
      <div class="battle-player-area">
        <div id="battle-player-sprite" class="battle-sprite player-sprite"></div>
        <div class="battle-name-tag"><img id="battle-player-elem-icon" class="elem-icon hidden" alt=""><span id="battle-player-name">-</span> <span id="battle-player-lv" class="hud-badge">Lv1</span></div>
        <div class="hud-bar-track battle-hpbar"><div id="battle-player-hp-bar" class="hud-bar-fill"></div><span id="battle-player-hp-text" class="hud-bar-label"></span></div>
        <div class="hud-bar-track battle-mpbar"><div id="battle-player-mp-bar" class="hud-bar-fill mp"></div><span id="battle-player-mp-text" class="hud-bar-label"></span></div>
        <div class="hud-bar-track battle-expbar"><div id="battle-player-exp-bar" class="hud-bar-fill exp"></div></div>
        <div class="battle-exp-caption">つぎのレベルまで</div>
      </div>
    </div>

    <div class="battle-lower">
      <div id="battle-party-row" class="battle-party-row"></div>
      <div id="battle-message" class="battle-message">-</div>
      <div id="battle-command-menu" class="battle-command-menu">
        <button class="battle-cmd-btn" data-cmd="skill">わざ</button>
        <button class="battle-cmd-btn" data-cmd="item">アイテム</button>
        <button class="battle-cmd-btn" data-cmd="swap">いれかえ</button>
        <button class="battle-cmd-btn" data-cmd="run">にげる</button>
      </div>
      <div id="battle-sub-menu" class="battle-sub-menu hidden">
        <div id="battle-sub-list" class="battle-sub-list"></div>
        <button id="battle-sub-back" class="btn btn-secondary btn-small">もどる</button>
      </div>
    </div>
  </div>

  <!-- ===== メニューモーダル ===== -->
  <div id="menu-modal" class="modal hidden">
    <div class="modal-card">
      <!-- ===== メニュー トップ(カテゴリ選択) ===== -->
      <div id="menu-page-top" class="menu-page">
        <h2>📖 メニュー</h2>
        <div class="menu-category-list">
          <button class="menu-category-btn" data-page="status">📊 ステータス</button>
          <button class="menu-category-btn" data-page="skills">⚔️ わざ <span class="menu-cat-count" id="menu-cat-skills-count"></span></button>
          <button class="menu-category-btn" data-page="items">🎒 どうぐ</button>
          <button class="menu-category-btn" data-page="companions">🐹 なかま <span class="menu-cat-count" id="menu-cat-companions-count"></span></button>
          <button class="menu-category-btn" data-page="badges">🎖️ バッジ <span class="menu-cat-count" id="menu-cat-badges-count"></span></button>
          <button class="menu-category-btn" id="menu-zukan-btn">📚 ずかん</button>
          <button class="menu-category-btn" id="menu-title-btn">🚪 タイトルへもどる</button>
        </div>
        <button class="btn btn-secondary modal-close">とじる</button>
      </div>

      <!-- ===== ステータス ===== -->
      <div id="menu-page-status" class="menu-page hidden">
        <button class="menu-back-btn">← もどる</button>
        <h2>📊 ステータス</h2>
        <div id="menu-status" class="menu-status"></div>
      </div>

      <!-- ===== わざ ===== -->
      <div id="menu-page-skills" class="menu-page hidden">
        <button class="menu-back-btn">← もどる</button>
        <h2>⚔️ わざ</h2>
        <div id="menu-skills" class="menu-skills"></div>
      </div>

      <!-- ===== どうぐ ===== -->
      <div id="menu-page-items" class="menu-page hidden">
        <button class="menu-back-btn">← もどる</button>
        <h2>🎒 どうぐ</h2>
        <div id="menu-items" class="food-list"></div>
      </div>

      <!-- ===== なかま ===== -->
      <div id="menu-page-companions" class="menu-page hidden">
        <button class="menu-back-btn">← もどる</button>
        <h2>🐹 なかま</h2>
        <div id="menu-companions" class="companion-list"></div>
      </div>

      <!-- ===== バッジ ===== -->
      <div id="menu-page-badges" class="menu-page hidden">
        <button class="menu-back-btn">← もどる</button>
        <h2>🎖️ バッジ <span id="badge-progress"></span></h2>
        <div id="menu-badges" class="badge-list"></div>
      </div>
    </div>
  </div>

  <!-- ===== ずかんモーダル ===== -->
  <div id="zukan-modal" class="modal hidden">
    <div class="modal-card">
      <h2>📚 モンスターずかん</h2>
      <p class="modal-sub"><span id="zukan-progress"></span> みつけた</p>
      <div id="zukan-detail" class="zukan-detail hidden"></div>
      <div id="zukan-grid" class="zukan-grid"></div>
      <button class="btn btn-secondary modal-close">とじる</button>
    </div>
  </div>

  <!-- ===== ショップモーダル ===== -->
  <div id="shop-modal" class="modal hidden">
    <div class="modal-card">
      <h2>🛍️ おみせ</h2>
      <p class="modal-sub">せんとうで やくだつ どうぐを うってるよ</p>
      <div id="shop-list" class="food-list"></div>
      <button class="btn btn-secondary modal-close">とじる</button>
    </div>
  </div>

  <!-- ===== 進化ルート選択モーダル ===== -->
  <div id="route-modal" class="modal hidden">
    <div class="modal-card">
      <h2>✨ しんかする!</h2>
      <p class="modal-sub">すすむ みちを えらんでね(あとから 変更できないよ)</p>
      <div id="route-choices" class="route-choices"></div>
    </div>
  </div>

  <!-- ===== スロット上書き確認モーダル ===== -->
  <div id="slot-overwrite-modal" class="modal hidden">
    <div class="modal-card">
      <h2>⚠️ うわがき確認</h2>
      <p id="slot-overwrite-msg" class="modal-sub"></p>
      <button id="slot-overwrite-confirm-btn" class="btn btn-primary">うわがきして はじめる</button>
      <button class="btn btn-secondary modal-close">やめる</button>
    </div>
  </div>

  <!-- ===== トースト ===== -->
  <div id="toast" class="toast hidden"></div>

  <!-- ===== エリア名バナー ===== -->
  <div id="area-banner" class="area-banner hidden"><span id="area-banner-text"></span></div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
